<!doctype html><meta charset="utf-8"><title>beta18 opacity checkbox minimal</title><style>body{font:20px sans-serif;padding:30px}.styled{position:relative;display:inline-flex;align-items:center;gap:12px}.styled input{position:absolute;left:0;top:0;width:32px;height:32px;opacity:0;margin:0;cursor:pointer}.skin{width:30px;height:30px;border:1px solid #333}.styled:has(input:checked) .skin{background:#14864e}</style><label class="styled"><input id="styled" type="checkbox" aria-label="Styled acceptance"><span class="skin"></span><span>Styled acceptance</span></label><output id="status">OFF</output><script>document.querySelector('#styled').onchange=e=>document.querySelector('#status').textContent=e.target.checked?'ON':'OFF';</script>
